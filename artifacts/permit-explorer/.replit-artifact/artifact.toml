kind = "web"
previewPath = "/"
title = "Montreal Permit Explorer"
version = "1.0.0"
id = "artifacts/permit-explorer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22712

[services.development]
run = "pnpm --filter @workspace/permit-explorer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/permit-explorer", "run", "build" ]
publicDir = "artifacts/permit-explorer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22712"
BASE_PATH = "/"
