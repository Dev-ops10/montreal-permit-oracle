openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Montreal Building Permit Explorer API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: permits
    description: Montreal building permit data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /permits/boroughs:
    get:
      operationId: listBoroughs
      tags: [permits]
      summary: List all boroughs
      description: Returns all distinct borough (arrondissement) names found in the permit dataset.
      responses:
        "200":
          description: List of boroughs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoroughList"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /permits/stats:
    get:
      operationId: getPermitStats
      tags: [permits]
      summary: Dataset statistics
      description: Returns summary statistics — total permits, counts by borough, and recent activity counts.
      responses:
        "200":
          description: Statistics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermitStats"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /permits/recent:
    get:
      operationId: getRecentPermits
      tags: [permits]
      summary: Recent permits by borough
      description: Returns permits issued in the given borough within the last N days.
      parameters:
        - name: borough
          in: query
          required: true
          schema:
            type: string
          description: Borough name (partial, case-insensitive)
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 7
            minimum: 1
            maximum: 3650
          description: How many days back to search (default 7)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
          description: Maximum number of results to return
      responses:
        "200":
          description: List of recent permits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermitList"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /permits/search:
    get:
      operationId: searchPermits
      tags: [permits]
      summary: Search permits by keyword
      description: Full-text search across address and work description fields.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: borough
          in: query
          required: false
          schema:
            type: string
          description: Optional borough filter
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
          description: Maximum number of results to return
      responses:
        "200":
          description: Matching permits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermitList"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /permits/large:
    get:
      operationId: getLargePermits
      tags: [permits]
      summary: Large-scale permits
      description: Returns permits for large residential projects (many housing units), sorted by scale.
      parameters:
        - name: min_units
          in: query
          required: false
          schema:
            type: integer
            default: 5
            minimum: 1
          description: Minimum number of housing units
        - name: borough
          in: query
          required: false
          schema:
            type: string
          description: Optional borough filter
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
          description: Maximum number of results to return
      responses:
        "200":
          description: Large-scale permits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermitList"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /permits/data-status:
    get:
      operationId: getDataStatus
      tags: [permits]
      summary: Data cache status
      description: Returns whether the permit CSV is loaded, total row count, and when it was last fetched.
      responses:
        "200":
          description: Cache status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataStatus"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    BoroughList:
      type: object
      properties:
        boroughs:
          type: array
          items:
            type: string
        total:
          type: integer
      required:
        - boroughs
        - total

    BoroughCount:
      type: object
      properties:
        borough:
          type: string
        count:
          type: integer
      required:
        - borough
        - count

    PermitStats:
      type: object
      properties:
        total_permits:
          type: integer
        last_7_days:
          type: integer
        last_30_days:
          type: integer
        last_365_days:
          type: integer
        by_borough:
          type: array
          items:
            $ref: "#/components/schemas/BoroughCount"
        top_work_types:
          type: array
          items:
            $ref: "#/components/schemas/BoroughCount"
      required:
        - total_permits
        - last_7_days
        - last_30_days
        - last_365_days
        - by_borough
        - top_work_types

    Permit:
      type: object
      properties:
        id:
          type: string
        address:
          type: string
        borough:
          type: string
        work_type:
          type: string
        work_detail:
          type: string
        building_type:
          type: string
        units:
          type: ["integer", "null"]
        date_issued:
          type: string
        date_started:
          type: ["string", "null"]
        longitude:
          type: ["number", "null"]
        latitude:
          type: ["number", "null"]
      required:
        - id
        - address
        - borough
        - work_type
        - work_detail
        - building_type
        - date_issued

    PermitList:
      type: object
      properties:
        permits:
          type: array
          items:
            $ref: "#/components/schemas/Permit"
        total:
          type: integer
        returned:
          type: integer
      required:
        - permits
        - total
        - returned

    DataStatus:
      type: object
      properties:
        loaded:
          type: boolean
        total_rows:
          type: ["integer", "null"]
        fetched_at:
          type: ["string", "null"]
      required:
        - loaded
        - total_rows
        - fetched_at
